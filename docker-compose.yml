###############################################################################
# ACM LLM Lab – Docker Compose
#
# This file only manages SearXNG. The remaining containers of the stack run
# OUTSIDE compose (started with docker run — do NOT `docker compose down` them):
#
#   qwen3.6-35b-a3b  vllm/vllm-openai, GPU 1, host port 8002
#                 --model Qwen/Qwen3.6-35B-A3B-FP8 --served-model-name qwen3.6-35b-a3b
#                 --max-model-len 131072 --reasoning-parser qwen3
#                 --enable-auto-tool-choice --tool-call-parser qwen3_xml
#   open-webui    ghcr.io/open-webui/open-webui:cuda, network bridge, 127.0.0.1:3010→8080
#                 fronted by caddy-proxy :3000; volume open-webui:/app/backend/data
#   caddy-proxy   host net — :3000 (WebUI front), :8081 (authed LLM gateway → vLLM)
#   litellm-proxy host net — 127.0.0.1:8003 logging passthrough to vLLM (no auth)
#   line-tunnel   cloudflared tunnel delivering LINE webhooks to the orchestrator
#   ollama        runs on the host (systemd, *:11434) — small model qwen2.5:3b-instruct
#                 acting as the intent router for the orchestrator (ROUTER_LLM_* in .env)
#   analog-llm    STOPPED spare (Qwen2.5-32B analog fine-tune, port 8004) — GPU 1 fits
#                 only one model at a time; weights kept on HDD4
#
# Orchestrator + sim-server: see docker-compose.orchestrator.yml.
# Monitoring (grafana/prometheus/loki...): see monitoring/docker-compose.monitoring.yml.
#
# Usage:  docker compose up -d searxng
###############################################################################

networks:
  app-net:
    external: true   # created by: docker network create app-net

services:

  # ──────────────────────────────────────────────────────────────
  # SEARXNG  –  Private meta-search engine (web search for Open WebUI)
  #    UI:   http://localhost:5050
  #    Open WebUI reaches it via http://host.docker.internal:5050 (it is on the bridge net)
  # ──────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - app-net

    environment:
      - BASE_URL=http://0.0.0.0:5050/
      - INSTANCE_NAME=acm-searxng
      - AUTOCOMPLETE=false

    ports:
      # loopback + docker bridge gateway only — Open WebUI reaches it via
      # host.docker.internal:5050; the LAN has no business querying it.
      - "127.0.0.1:5050:8080"
      - "172.17.0.1:5050:8080"

    volumes:
      - ./searxng:/etc/searxng

    tty: false
    stdin_open: false
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "20m"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
