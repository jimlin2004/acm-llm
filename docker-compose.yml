###############################################################################
# ACM LLM Lab – Docker Compose
#
# This file only manages SearXNG. The remaining containers of the stack run
# OUTSIDE compose (started with docker run — do NOT `docker compose down` them):
#
#   qwen3-vl-32b  vllm/vllm-openai:latest, network bridge, port 8000
#                 --model Qwen/Qwen3-VL-32B-Thinking-FP8 --served-model-name qwen3-vl-32b
#                 --max-model-len 32768 --gpu-memory-utilization 0.85
#                 --reasoning-parser qwen3   (GPU 1 only, DeviceIDs=["1"])
#   open-webui    ghcr.io/open-webui/open-webui:cuda, network bridge, port 3000→8080
#                 OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
#                 volume open-webui:/app/backend/data
#   ollama        runs on the host (systemd, *:11434) — small model qwen2.5:3b-instruct
#                 acting as the intent router for the orchestrator (ROUTER_LLM_* in .env)
#
# Orchestrator + sim-mock: see docker-compose.orchestrator.yml.
# Monitoring (grafana/prometheus/loki...): separate compose outside this repo.
#
# Usage:  docker compose up -d searxng
###############################################################################

networks:
  app-net:
    external: true   # created by: docker network create app-net

services:

  # ──────────────────────────────────────────────────────────────
  # SEARXNG  –  Private meta-search engine (web search for Open WebUI)
  #    UI:   http://localhost:5050
  #    Open WebUI reaches it via http://host.docker.internal:5050 (it is on the bridge net)
  # ──────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - app-net

    environment:
      - BASE_URL=http://0.0.0.0:5050/
      - INSTANCE_NAME=acm-searxng
      - AUTOCOMPLETE=false

    ports:
      - "5050:8080"

    volumes:
      - ./searxng:/etc/searxng

    tty: false
    stdin_open: false
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "20m"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
