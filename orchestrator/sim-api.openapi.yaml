openapi: 3.1.0
info:
  title: Circuit Simulation API (sim-server)
  version: "1.0"
  description: |
    API the simulation server must publish so the orchestrator
    (acm-llm) can call it. The client-side contract is fixed in
    `app/tools/simulator.py` — any sim server that implements this spec exactly
    can be swapped in just by changing the `SIM_API_URL` environment
    variable, with no orchestrator code changes.

    See sim-server/README.md ("Spec conformance") for the operational
    requirements (timeout, retry, response size).

servers:
  - url: http://sim-server:9000
    description: simulation server (set via SIM_API_URL)

security:
  - bearerAuth: []

paths:
  /simulate:
    post:
      operationId: simulate
      summary: Run a SPICE netlist simulation and return the results (synchronous)
      description: |
        Accepts a SPICE netlist, runs the analyses declared in the netlist
        (.op/.ac/.dc/.tran/.noise...), and returns the results within the same
        request. Must respond within the client's SIM_TIMEOUT (default 180 s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimRequest"
      responses:
        "200":
          description: |
            The simulation was executed. Even when the circuit fails (does not
            converge, invalid SPICE syntax...) still return 200 with
            `status: "error"` plus `errors`/`log` — so the LLM can read the
            error and explain it to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimResponse"
        "400":
          description: Malformed request (missing `netlist`, broken JSON). Client does NOT retry; the message is shown to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        "401":
          description: Missing or invalid Bearer token. Client does NOT retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
        "500":
          description: Internal server error. Client retries at most 2 times (backoff 2s/4s) — the handler must be safe to call repeatedly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <SIM_API_KEY>`. The client only sends this
        header when SIM_API_KEY is configured; if the server needs no auth,
        it is omitted.

  schemas:
    SimRequest:
      type: object
      required: [netlist]
      properties:
        netlist:
          type: string
          description: Complete SPICE netlist (UTF-8), including the .ac/.tran/.op/.end lines.
          examples:
            - |
              * RC low-pass filter
              V1 in 0 AC 1
              R1 in out 1k
              C1 out 0 159n
              .ac dec 10 10 1Meg
              .end
        options:
          type: object
          description: |
            Simulation options, default {}. The server defines its own keys
            and must ignore unknown keys (must not return an error).
            Suggested conventions: `engine`, `temperature_c`, `corner`,
            `max_runtime_s`.
          additionalProperties: true
          default: {}
          properties:
            include_waveforms:
              type: boolean
              default: false
              description: |
                true → the response also carries a `waveforms` field
                (decimated x/y arrays) so the client can plot charts itself.
                Off by default to keep the response < 50 KB for old callers.
            max_points:
              type: integer
              default: 2000
              minimum: 1
              maximum: 20000
              description: Max points per waveform (the server decimates uniformly, always keeping the first/last points).

    SimResponse:
      type: object
      required: [status, results, log]
      description: |
        This object (except `waveforms`) is inserted verbatim into the LLM
        prompt — return only aggregated metrics in `results`. Total size
        should be < 50 KB (`log` trimmed to the last few KB); when
        `include_waveforms=true` the budget stretches to ~2 MB and the client
        must strip `waveforms` out before prompting the LLM.
      properties:
        status:
          type: string
          enum: [ok, error]
          description: ok = the simulation completed; error = the run failed (details in errors/log).
        engine:
          type: string
          description: Engine name + version, e.g. "ngspice-42".
        analyses_run:
          type: array
          items:
            type: string
          description: The analyses that were run, e.g. ["op", "ac"].
        results:
          type: object
          description: |
            Results per analysis. Key = analysis name, value = object of
            aggregated numeric metrics. Return {} when status = error.
          additionalProperties:
            type: object
            additionalProperties: true
          examples:
            - op: { "v(out)": 2.5, "v(in)": 5.0, "i(v1)": -0.0025 }
              ac: { gain_db_at_1khz: -3.01, f_3db_hz: 1002.7, phase_margin_deg: 67.2 }
              tran: { v_out_peak: 1.23, settling_time_us: 4.5, overshoot_pct: 8.1 }
        log:
          type: string
          description: Simulator log (trimmed) — the most important part when status = error.
        warnings:
          type: array
          items:
            type: string
          default: []
        errors:
          type: array
          items:
            type: string
          description: Must be non-empty when status = error.
          default: []
        waveforms:
          type: object
          description: |
            Only present when the request sets
            `options.include_waveforms=true`. Key = analysis name
            (`ac`/`tran`/`dc`), value = x/y data decimated to `max_points`
            for the client to plot itself. Series per analysis:
            ac → gain_db + phase_deg (x = frequency Hz), tran → v_out
            (x = time s), dc → v_out (x = sweep). op/noise have no waveform.
          additionalProperties:
            $ref: "#/components/schemas/Waveform"

    Waveform:
      type: object
      required: [x, series]
      properties:
        x_name:
          type: string
          description: X-axis name, e.g. "frequency", "time", "sweep".
        x_unit:
          type: string
          description: X-axis unit, e.g. "Hz", "s".
        x:
          type: array
          items:
            type: number
        series:
          type: object
          description: Each key is one curve (same length as `x`).
          additionalProperties:
            type: array
            items:
              type: number
        points:
          type: integer
          description: Number of points after decimation.
        truncated:
          type: boolean
          description: true if the original data was downsampled to max_points.

    HttpError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Short error description, safe to show to the end-user.
