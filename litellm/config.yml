  #     model: openai/qwen2.5-1.5b
  #     api_base: http://vllm:8000/v1
  #     api_key: vllm
  # - model_name: gpt-3.5-turbo
  #   litellm_params:
  #     model: openai/qwen2.5-1.5b
  #     api_base: http://vllm:8000/v1
  #     api_key: vllm

  # ─── OpenAI (key from .env → OPENAI_API_KEY) ─────────────────────────
