    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ─── DISABLED: missing API key. Set the key in .env and uncomment ─────
  #
  # Extra OpenAI models — need OPENAI_API_KEY in .env
  # - model_name: gpt-5-mini
