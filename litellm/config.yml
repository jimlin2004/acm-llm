model_list:
  # ─── Local vLLM models ───────────────────────────────────────────────
  - model_name: qwen2.5-1.5b
    litellm_params:
      model: openai/qwen2.5-1.5b
      api_base: http://vllm:8000/v1
      api_key: vllm
    model_info:
      supports_vision: false

  - model_name: qwen3-vl-32b
    litellm_params:
      model: openai/qwen3-vl-32b
      api_base: http://vllm:8000/v1
      api_key: vllm
    model_info:
      supports_vision: true

  # ─── DISABLED: gpt-* aliases pointing to the local Qwen are misleading ──
