litellm_settings:
  # Do not retry when vLLM fails (avoids double-charging tokens)
  num_retries: 0
  request_timeout: 600

general_settings:
  master_key: sk-acm-llm-master-2026   # used to create virtual keys via API/UI
  database_url: "postgresql://litellm:litellm2026@litellm-db:5432/litellm"
  # Take user identity from the header Open WebUI sends (needs ENABLE_FORWARD_USER_INFO_HEADERS=true in Open WebUI)
  user_header_name: "X-OpenWebUI-User-Email"

  # Default rate limits applied to every key (can be overridden per key)
  default_team_settings:
    tpm_limit: 100000    # tokens per minute
    rpm_limit: 60        # requests per minute
