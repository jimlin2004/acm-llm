global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: acm-llm-lab

alerting:
  alertmanagers: []

rule_files:
  - "alerts.yml"

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (CPU, RAM, Disk, Network)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: acm-llm-host

  # Per-container metrics (CPU, RAM, Network per Docker container)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - target_label: instance
        replacement: acm-llm-host

  # NVIDIA GPU metrics (utilization, VRAM, temperature, power)
  - job_name: nvidia-gpu
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']
    relabel_configs:
      - target_label: instance
        replacement: acm-llm-host

  # vLLM inference engine metrics (request count, token throughput, KV cache, latency)
  # The vLLM container publishes host port 8002; reached via the host gateway
  # (extra_hosts on the prometheus service).
  - job_name: vllm
    static_configs:
      - targets: ['host.docker.internal:8002']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: vllm

  # Orchestrator flow/LLM metrics (acm_flows_*, acm_llm_*) — same app-net,
  # scraped by service name. See orchestrator/app/metrics.py.
  - job_name: orchestrator
    static_configs:
      - targets: ['orchestrator:8000']
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: orchestrator
