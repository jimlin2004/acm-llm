groups:
  - name: acm-llm-lab
    rules:

      # ── Service availability ────────────────────────────────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for > 1 minute."

      # ── Host CPU ────────────────────────────────────────────────────────
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage > 90% for 5 minutes."

      # ── Host RAM ────────────────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "RAM usage > 90% for 5 minutes."

      # ── Disk ────────────────────────────────────────────────────────────
      - alert: DiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk almost full on {{ $labels.mountpoint }}"
          description: "Disk usage > 85% on {{ $labels.instance }}:{{ $labels.mountpoint }}."

      # ── GPU ─────────────────────────────────────────────────────────────
      - alert: HighGPUTemperature
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature high ({{ $value }}°C)"
          description: "GPU {{ $labels.gpu }} temperature > 85°C for 5 minutes."

      - alert: GPUMemoryAlmostFull
        expr: (nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes) * 100 > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM almost full"
          description: "GPU {{ $labels.gpu }} VRAM usage > 95% for 5 minutes."

  - name: acm-orchestrator
    rules:

      # ── Orchestrator load ───────────────────────────────────────────────
      - alert: FlowsSaturated
        expr: acm_flows_inflight >= acm_flows_capacity
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Orchestrator at its concurrency cap"
          description: "In-flight flows have been at the cap ({{ $value }}) for 5 minutes — users are getting 'busy' replies."

      - alert: FlowsRejected
        expr: increase(acm_flows_rejected_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Orchestrator shedding load"
          description: "More than 5 requests rejected (busy) in the last 10 minutes."

      - alert: FlowFailures
        expr: increase(acm_flows_total{status=~"failed|error"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Flows failing"
          description: "More than 3 failed flows in 15 minutes — check the orchestrator logs / access.jsonl."

      - alert: SlowFlows
        expr: histogram_quantile(0.95, sum by (le) (rate(acm_flow_duration_seconds_bucket[15m]))) > 240
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Flow p95 latency > 4 min"
          description: "p95 end-to-end flow duration exceeded 240s — Telegram replies risk the 300s timeout."
