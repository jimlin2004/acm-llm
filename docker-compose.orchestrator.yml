###############################################################################
# Orchestrator stack (see docs/orchestrator.md + orchestrator/README.md)
#
# Standalone compose file — does not touch the running vllm/open-webui
# containers. LLM calls go straight to vLLM on the host port 8002.
#
# Usage:
#   docker compose -f docker-compose.orchestrator.yml up -d --build
#
# Simulator: local sim-server container (ngspice) on app-net, reached as
# http://sim-server:9000/simulate. No Tailscale dependency. SIM_API_URL in .env.
###############################################################################

networks:
  app-net:
    external: true

services:

  sim-server:
    build: ./sim-server
    image: sim-server:local
    container_name: sim-server
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - SIM_API_KEY=${SIM_API_KEY:-}
      - LOG_LEVEL=INFO
    ports:
      # loopback only — orchestrator reaches it by service name over app-net
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    build: ./orchestrator
    container_name: orchestrator
    restart: unless-stopped
    depends_on:
      - sim-server
    networks:
      - app-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8002/v1}
      - LLM_API_KEY=${LLM_API_KEY:-none}
      - LLM_MODEL=${LLM_MODEL:-qwen3.6-35b-a3b}
      - ROUTER_LLM_BASE_URL=${ROUTER_LLM_BASE_URL:-}
      - ROUTER_LLM_API_KEY=${ROUTER_LLM_API_KEY:-}
      - ROUTER_LLM_MODEL=${ROUTER_LLM_MODEL:-}
      # Hermes tool-calling model for the agentic hermes_eval flow (own vLLM)
      - HERMES_LLM_BASE_URL=${HERMES_LLM_BASE_URL:-}
      - HERMES_LLM_API_KEY=${HERMES_LLM_API_KEY:-}
      - HERMES_LLM_MODEL=${HERMES_LLM_MODEL:-}
      - SIM_API_URL=${SIM_API_URL:-http://sim-server:9000/simulate}
      - SIM_API_KEY=${SIM_API_KEY:-}
      - SIM_TIMEOUT=${SIM_TIMEOUT:-180}
      - SIM_RETRIES=${SIM_RETRIES:-1}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_PUBLIC_BASE=${LINE_PUBLIC_BASE:-}
      - LINE_ALLOWED_USER_IDS=${LINE_ALLOWED_USER_IDS:-}
      - LINE_RATE_N=${LINE_RATE_N:-5}
      - LINE_RATE_WINDOW=${LINE_RATE_WINDOW:-60}
      - MIGRATION_API_URL=${MIGRATION_API_URL:-http://host.docker.internal:5000}
      - MIGRATION_DRY_RUN=${MIGRATION_DRY_RUN:-true}
      - MIGRATION_LLM_PROVIDER=${MIGRATION_LLM_PROVIDER:-openai}
      - MIGRATION_LLM_MODEL=${MIGRATION_LLM_MODEL:-gpt-5-mini}
      # Abuse guard: global cap on concurrently running flows.
      - MAX_CONCURRENT_FLOWS=${MAX_CONCURRENT_FLOWS:-3}
    ports:
      # NOT 0.0.0.0 — the API has no auth. Loopback for host tools plus the
      # docker bridge gateway so Open WebUI (bridge net) still reaches it via
      # host.docker.internal; the LAN cannot.
      - "127.0.0.1:8100:8000"
      - "172.17.0.1:8100:8000"
    volumes:
      - ./orchestrator/data:/data
